  privacy:
    title:
      zh-CN: 隐私政策
      en: Privacy Policy
    description:
      zh-CN: 说明本站如何处理访问、订阅、评论、广告合作和第三方集成中可能涉及的数据。
      en: How this site handles data related to visits, subscriptions, comments, sponsorships, and third-party integrations.
    summary:
      zh-CN: Midnight 默认静态优先，不要求用户登录；订阅、评论、广告和分析等能力应由站点所有者按需接入并明确披露。
      en: Midnight is static-first by default and does not require login; subscriptions, comments, ads, and analytics should be connected and disclosed by the site owner.
    updated:
      zh-CN: 2026-05-19
      en: May 19, 2026
    sections:
      - title:
          zh-CN: 我们收集什么
          en: What we collect
        description:
          zh-CN: 主题本身不建立用户账户，也不默认收集个人身份信息。若站点启用评论、通讯订阅、搜索、广告或统计服务，相关数据由站点配置的第三方或自有服务处理。
          en: The theme itself does not create user accounts or collect personal identity data by default. If comments, newsletter signup, search, ads, or analytics are enabled, data is handled by the configured third-party or site-owned service.
      - title:
          zh-CN: 订阅通讯
          en: Newsletter subscriptions
        description:
          zh-CN: 通讯表单只是前端入口。邮箱、退订状态和投递记录应由站点接入的邮件服务保存，并在实际使用时提供退订方式。
          en: Newsletter forms are frontend entry points. Email addresses, unsubscribe state, and delivery records should be stored by the connected mail service, with an unsubscribe method provided in real use.
      - title:
          zh-CN: 评论与互动
          en: Comments and interactions
        description:
          zh-CN: 若启用 Giscus、Waline、Utterances 或其他评论系统，评论内容、账号标识和互动记录会遵循对应服务的隐私规则。
          en: If Giscus, Waline, Utterances, or another comment system is enabled, comment content, account identifiers, and interaction records follow that service's privacy rules.
      - title:
          zh-CN: 广告与赞助
          en: Ads and sponsorships
        description:
          zh-CN: 主题提供清晰标注的广告展示位。若站点接入广告网络或追踪脚本，应遵守当地隐私、同意和披露要求。
          en: The theme provides clearly marked ad placements. If ad networks or tracking scripts are added, the site should follow local privacy, consent, and disclosure requirements.
      - title:
          zh-CN: Cookie 与本地存储
          en: Cookies and local storage
        description:
          zh-CN: 主题可能使用本地存储、会话存储、Cookie 或 window.name 保存颜色主题偏好，不用于跨站追踪。
          en: The theme may use local storage, session storage, cookies, or window.name to remember color-scheme preference, not for cross-site tracking.
      - title:
          zh-CN: 联系方式
          en: Contact
        description:
          zh-CN: 如需查询、更正或删除由站点服务保存的信息，请联系站点所有者，并说明相关页面、邮箱或评论账号。
          en: To access, correct, or delete information stored by site services, contact the site owner with the relevant page, email address, or comment account.
