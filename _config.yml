inner_pages:
  about:
    title:
      zh-CN: 关于 Midnight
      en: About Midnight
    description:
      zh-CN: Midnight 面向技术发布者，帮助长文、多语言内容、AI 阅读助手和商业化模块保持同一套清晰体验。
      en: Midnight helps technical publishers keep articles, multilingual content, AI reading, and monetization modules in one coherent experience.
    mission:
      zh-CN: 用静态优先的 Hexo 工作流，承载现代技术媒体需要的首页、归档、专题和阅读辅助能力。
      en: Build a static-first Hexo workflow that supports the homepage, archives, topics, and reading assistance expected from a modern technical publication.
    principles:
      - title:
          zh-CN: 静态优先
          en: Static first
        description:
          zh-CN: 没有后端也能完整阅读；动态功能保持可选。
          en: Reading works without a backend; dynamic features stay optional.
      - title:
          zh-CN: 显式多语言
          en: Explicit i18n
        description:
          zh-CN: 语言、翻译关系和路由策略都由配置与 front matter 明确表达。
          en: Language, translation relationships, and route strategy are expressed through config and front matter.
      - title:
          zh-CN: 克制现代
          en: Modern restraint
        description:
          zh-CN: 视觉要有技术感，但不喧宾夺主。
          en: The interface should feel technical without overwhelming the reading.
    contact:
      name:
        zh-CN: Midnight Team
        en: Midnight Team
      role:
        zh-CN: 内容合作 / 技术发布
        en: Content partnerships / Technical publishing
      avatar: ""
      description:
        zh-CN: 欢迎交流主题定制、内容共创、广告投放、专题合作和长期技术媒体建设。请尽量说明合作目标、时间周期和预算范围，方便快速判断匹配度。
        en: Reach out for theme customization, co-created content, advertising, topic sponsorships, or long-term technical media work. Include goals, timing, and budget range so we can evaluate fit quickly.
      links:
        - type: wechat
          label:
            zh-CN: 微信
            en: WeChat
          url: weixin://
          image: ""
        - type: email
          label:
            zh-CN: 邮箱
            en: Email
          url: mailto:ht@zyweb.vip
        - type: github
          label: GitHub
          url: https://github.com/midnight-ht/hexo-theme-midnight
        - type: csdn
          label: CSDN
          url: https://blog.csdn.net/
      footer:
        zh-CN: 通常 1-2 个工作日回复；商业合作请优先通过邮箱发送完整需求。
        en: Replies usually arrive within 1-2 business days; for commercial work, email a complete brief first.
    map:
      - title:
          zh-CN: 静态优先工作流
          en: Static-first workflow
        body:
          zh-CN: 静态托管 + 构建期 i18n + 可选动态能力。
          en: Static hosting, build-time i18n, and optional dynamic features.
      - title:
          zh-CN: 编辑判断
          en: Editorial judgement
        body:
          zh-CN: 频道、精选、地图取代纯时间流。
          en: Channels, picks, and maps replace pure chronology.
      - title:
          zh-CN: 商业化模块
          en: Monetization modules
        body:
          zh-CN: 广告、订阅、专题入口保持视觉清晰。
          en: Ads, subscriptions, and topic entries stay visually clean.
      - title:
          zh-CN: 多语言体验
          en: Multilingual experience
        body:
          zh-CN: ZH / EN 共用一套主题，路由策略由配置驱动。
          en: ZH / EN share one theme, route strategy driven by config.
  advertise:
    title:
      zh-CN: 广告合作
      en: Advertise with Midnight
    description:
      zh-CN: 面向技术读者、产品团队和商业决策者的赞助合作页面，清晰呈现版位、流程和编辑边界。
      en: Reach technical readers, product teams, and business decision makers through clearly marked sponsorships.
    stats:
      - value: 42k
        label:
          zh-CN: 月度技术读者
