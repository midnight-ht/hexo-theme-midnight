name: midnight
description: A modern technology Hexo theme with AI session, i18n, sitemap, and comments support.

favicon: /img/favicon.png
apple_touch_icon: /img/favicon.png
tab_title_separator: " | "
force_https: false

appearance:
  logo: ""
  logo_text: Midnight
  nick: Midnight
  accent: "#4df2c8"
  default_scheme: dark
  background: default

nav:
  home:
    name: home
    path: /
  items:
    - name: AI Agent
      path: /tags/AI-Agent/
      style: underline
      active_match:
        - /tags/AI-Agent/
    - name:
        zh-CN: 工程化
        en: Engineering
      path: /tags/Engineering/
      style: underline
      active_match:
        - /tags/Engineering/
    - name:
        zh-CN: 商业观察
        en: Business
      path: /tags/Business/
      style: underline
      active_match:
        - /tags/Business/
    - name:
        zh-CN: 产品
        en: Product
      path: /tags/Product/
      style: underline
      active_match:
        - /tags/Product/
    - name:
        zh-CN: 专题
        en: Topics
      path: /tags/
      style: text
      active_exact: true
      active_match:
        - /tags/
  archives:
    name: archives
    path: /archives/
  about:
    name: about
    path: /about/

i18n:
  default_lang: zh-CN
  route_strategy: auto
  languages:
    - zh-CN
    - en
  article_lang_field: lang
  translation_key_field: translation_key

model_session:
  enabled: true
  endpoint: ""
  title:
    zh-CN: AI 会话
    en: AI Session
  default_system_prompt: "You are a helpful technical reading assistant. Answer with concise, grounded context from the current article."
  allow_user_system_prompt: true
  max_messages: 12

comments:
  enabled: false
  enable: false
  provider: giscus
  type: giscus
  giscus:
    repo: ""
    repo_id: ""
    category: ""
    category_id: ""
    mapping: pathname
    reactions_enabled: "1"
    emit_metadata: "0"
    theme: preferred_color_scheme
  waline:
    server_url: ""
    serverURL: ""
    placeholder: ""
    lang: zh-CN
    page_size: 10
  utterances:
    repo: ""
    issue_term: pathname
    theme: github-dark
    theme_dark: github-dark
    label: ""
    crossorigin: anonymous

sitemap:
  enabled: true
  path: sitemap.xml

feed:
  enabled: true
  path: atom.xml
  title: RSS

contact:
  email: ht@zyweb.vip

seo:
  twitter_card: summary_large_image
  open_graph: true
  open_graph_image: ""
  robots: index,follow
  keywords: ""
  baidu_site_verification: ""
  google_site_verification: ""
  bing_site_verification: ""

web_analytics:
  enabled: false
  enable: false
  baidu: ""
  google: ""
  gtag: ""
  cnzz: ""
  woyaola: ""
  busuanzi:
    enabled: false
    enable: false
  leancloud:
    app_id: ""
    app_key: ""
    server_url: ""

footer:
  statistics:
    enabled: false
    enable: false
    source: busuanzi
    pv_format:
      zh-CN: "总访问量 {} 次"
      en: "{} page views"
    uv_format:
      zh-CN: "总访客数 {} 人"
      en: "{} visitors"

